---
name: Build Nova Play (Windows)
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=1.0.${GITHUB_RUN_NUMBER}
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"



  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
